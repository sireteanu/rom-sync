# Rom Sync for Unraid's Compose Manager: builds the image on the server straight from GitHub.
# Docker > Compose > Add New Stack "rom-sync" > Edit Stack > Compose File: paste this, then Compose Up.
# Every "Compose Up" fetches the latest code from GitHub and rebuilds (pull_policy: build).
services:
  rom-sync:
    build:
      context: https://github.com/sireteanu/rom-sync.git#main
      # no git on the server? download the code to this folder instead (see README) and use:
      # context: /path/to/appdata/rom-sync/src
    pull_policy: build
    image: rom-sync:latest
    container_name: rom-sync
    ports:
      - "8484:8484"
    volumes:
      - /path/to/appdata/rom-sync/config:/config   # catalog, settings, ticks, log
      - /path/to/roms:/data                         # synced files - change to your share
    environment:
      - PUID=99            # nobody
      - PGID=100           # users
      - UMASK=000
      - TZ=America/Toronto
      # - LOLROMS_PASSWORD=change-me
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8484]/"
    restart: unless-stopped
