# Runs the tests and the linter on every push and pull request (all traffic goes to the in-process
# mock site - nothing touches lolroms.com).
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ubuntu-latest moved to Ubuntu 26.04 (November 2026), which has no Python 3.9 builds;
    # 24.04 still has both versions the app supports
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes src tests
      - run: python -m pytest
