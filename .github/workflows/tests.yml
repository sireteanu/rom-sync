# Runs the tests and the linter on every push and pull request (all traffic goes to the in-process
# mock site - nothing touches lolroms.com).
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # pinned: ubuntu-latest (Ubuntu 26.04 since November 2026) lacks older Python builds.
    # Tests run on the oldest Python Rom Sync supports and the one its Docker image uses.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes src tests
      - run: python -m pytest
