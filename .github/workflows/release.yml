# Creates a GitHub release (v<version>, notes generated from the commits) the first time a new
# version in pyproject.toml reaches main. To release: raise the version and push.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release the version in pyproject.toml if it is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released - nothing to do"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Rom Sync $version" --generate-notes
            echo "Released $tag"
          fi
