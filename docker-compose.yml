services:
  lolroms-sync:
    build: .
    image: lolroms-sync:latest
    container_name: lolroms-sync
    ports:
      - "8484:8484"
    volumes:
      - ./config:/config          # catalog, settings and selection
      - /path/to/roms:/data      # where synced files go - change to your share
    environment:
      - PUID=99                   # Unraid: nobody
      - PGID=100                  # Unraid: users
      - UMASK=000
      - TZ=America/Toronto        # used for file dates and the schedule
      # - LOLROMS_PASSWORD=change-me   # ask for a password in the browser
    restart: unless-stopped
