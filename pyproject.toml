[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lolroms-sync"
version = "1.4.6"
description = "Browse the whole lolroms.com catalog in a web interface and keep the folders you pick in sync"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
lolroms-sync = "lolroms_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lolroms_sync = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
